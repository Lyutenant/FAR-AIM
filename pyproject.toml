[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "far-aim"
version = "0.1.0"
description = "Deterministic pipeline that builds an Obsidian vault from authoritative FAR/AIM/PCG sources"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
far-aim = "far_aim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/far_aim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
